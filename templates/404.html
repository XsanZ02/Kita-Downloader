<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tidak Ditemukan</title>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.add('light-mode');
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --text: #f0eeff;
      --muted: #8b8b9e;
      --accent: #c8f135;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    :root.light-mode {
      --bg: #f4f4f8;
      --text: #12121a;
      --muted: #666677;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    /* Efek Glow */
    body::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(200,241,53,0.05) 0%, transparent 70%);
      pointer-events: none; z-index: -1;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 10px;
      text-shadow: 0 0 40px rgba(200, 241, 53, 0.2);
    }
    h2 { font-size: 1.5rem; margin-bottom: 15px; }
    p { color: var(--muted); margin-bottom: 30px; max-width: 400px; line-height: 1.6; }
    .btn-home {
      background: var(--accent);
      color: #000;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-home:hover { background: #b5db2e; transform: translateY(-3px); }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Oops! Tersesat ya?</h2>
  <p>Halaman yang Anda cari mungkin telah dihapus, diubah namanya, atau memang tidak pernah ada.</p>
  <a href="/" class="btn-home">Kembali ke Beranda</a>
</body>
</html>
