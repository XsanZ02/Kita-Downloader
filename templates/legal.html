<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Kita.in</title>
  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.add('light-mode');
    }
  </script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: rgba(255,255,255,0.07);
      --text: #f0eeff;
      --muted: #8b8b9e;
      --accent: #c8f135;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --overlay: rgba(255,255,255,0.05);
      --accent-text: #c8f135;
    }
    :root.light-mode {
      --bg: #f4f4f8;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --text: #12121a;
      --muted: #666677;
      --overlay: rgba(0,0,0,0.05);
      --accent-text: #4a6b00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-body);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }

    /* Top Navbar (Sticky) */
    .top-nav {
      position: sticky; top: 0; z-index: 1000; width: 100%;
      transition: all 0.3s ease;
    }
    .top-nav.scrolled {
      background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .light-mode .top-nav.scrolled { background: rgba(244, 244, 248, 0.8); }
    .nav-container { max-width: 1000px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; transition: all 0.3s ease; }
    .top-nav.scrolled .nav-container { padding: 12px 24px; }
    .top-nav .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .nav-logo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .top-nav .brand span { color: var(--accent-text); }
    .nav-menu { display: flex; gap: 15px; align-items: center; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent-text); }
    .mobile-menu-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; align-items: center; justify-content: center; padding: 4px; }
    @media (max-width: 600px) { 
      .nav-links { 
        position: absolute; top: 100%; left: 0; right: 0; 
        background: rgba(10, 10, 15, 0.98); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        flex-direction: column; padding: 20px; gap: 20px; 
        border-bottom: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: none;
      }
      .light-mode .nav-links { background: rgba(244, 244, 248, 0.98); }
      .nav-links.active { display: flex; animation: slideDownMenu 0.3s ease forwards; }
      .mobile-menu-btn { display: flex; }
    }
    @keyframes slideDownMenu { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    #themeToggle {
      background: transparent; border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px;
      cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0;
    }
    #themeToggle:hover { background: var(--overlay); transform: scale(1.05); }

    .container {
      width: 100%; max-width: 800px; padding: 40px 24px; flex: 1;
    }
    header { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    h1 { font-family: var(--font-display); font-size: 2.5rem; color: var(--accent-text); margin-bottom: 10px; }
    .date { color: var(--muted); font-size: 0.95rem; }
    
    .content-section { margin-bottom: 30px; }
    .content-section h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 12px; color: var(--text); }
    .content-section p { color: var(--muted); line-height: 1.7; font-size: 1rem; }

    footer { margin-top: 40px; padding: 30px 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; text-align: center; width: 100%; }
    footer a { color: var(--text); text-decoration: none; margin: 0 10px; font-weight: 500; }
    footer a:hover { color: var(--accent-text); }

    .btn-donate {
      position: relative; display: inline-flex; align-items: center; gap: 8px; background: #ff4757; color: #fff !important;
      padding: 10px 20px; border-radius: 12px; font-weight: 700; margin-top: 15px; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); border: none; z-index: 1; text-decoration: none;
    }
    .btn-donate::after {
      content: ''; position: absolute; inset: 0; border-radius: 12px; border: 2px solid #ff4757; z-index: -1;
      animation: pulseDonate 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .btn-donate:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(255,71,87,0.4); background: #ff2a3f; }
    .btn-donate:active { transform: translateY(0) scale(0.98); }
    .coffee-icon { display: inline-block; transition: transform 0.3s ease; }
    .btn-donate:hover .coffee-icon { transform: rotate(18deg) scale(1.2) translateY(-2px); }
    @keyframes pulseDonate {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar (Sticky) -->
  <nav class="top-nav" id="topNav">
    <div class="nav-container">
      <a href="/" class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="nav-logo">
        Kita.<span>in</span>
      </a>
      <div class="nav-menu">
        <div class="nav-links" id="navLinks">
          <a href="/" onclick="document.getElementById('navLinks').classList.remove('active')">Beranda</a>
          <a href="/#cards" onclick="document.getElementById('navLinks').classList.remove('active')">Tools</a>
          <a href="/contact" onclick="document.getElementById('navLinks').classList.remove('active')">Kontak</a>
        </div>
        <button id="themeToggle" title="Ganti Tema">🌙</button>
        <button class="mobile-menu-btn" onclick="document.getElementById('navLinks').classList.toggle('active')" title="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>{{ title }}</h1>
      <div class="date">Pembaruan Terakhir: {{ last_updated }}</div>
    </header>

    <!-- Rendering Konten secara Dinamis -->
    {% for section in content %}
    <div class="content-section">
      <h2>{{ section.heading }}</h2>
      <p>{{ section.text }}</p>
    </div>
    {% endfor %}
  </div>

  <footer>
    &copy; 2024 Kita.in - Semua Hak Cipta Dilindungi.<br>
    <div style="margin-top: 10px;">
      <a href="/tos">Terms of Service</a> | <a href="/privacy">Privacy Policy</a> | <a href="/contact">Contact Us</a>
    </div>
    <a href="https://trakteer.id/iam_tomz/tip" target="_blank" class="btn-donate"><span class="coffee-icon">☕</span> Dukung Developer</a>
  </footer>

  <script>
    // Logika Sinkronisasi Tema
    const themeBtn = document.getElementById('themeToggle');
    if (document.documentElement.classList.contains('light-mode')) themeBtn.textContent = '☀️';
    
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('light-mode');
      const isLightMode = document.documentElement.classList.contains('light-mode');
      themeBtn.textContent = isLightMode ? '☀️' : '🌙';
      localStorage.setItem('theme', isLightMode ? 'light' : 'dark');
    });

    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        document.documentElement.classList.toggle('light-mode', e.matches);
        themeBtn.textContent = e.matches ? '☀️' : '🌙';
      }
    });

    // Efek Sticky Navbar saat di-scroll
    window.addEventListener('scroll', () => {
      const nav = document.getElementById('topNav');
      if (window.scrollY > 20) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });
  </script>
</body>
</html>
